[project]
name = "workflow_organising_tool"
version = "0.6"
description = "A better way of organising my workflow."
readme = { 
  file = "README.adoc", 
  content-type = "text/x-asciidoc"
}
requires-python = ">= 3.13.5"
license = {
  text = "All Rights Reserved"
}
keywords = [ "productivity", "workflow", "project-management" ]
classifiers = [
  "Development Status :: 2 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows :: Windows 11"
]
dependencies = [
  "toga>=0.5.6",
  "tomlkit>=0.15.1",
  "pylnk3"
]

[project.urls]
repository = "https://github.com/ayankumarsarkar/wot"
issues = "https://github.com/ayankumarsarkar/wot/issues"